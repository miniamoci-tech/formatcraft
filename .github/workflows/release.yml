name: Release

# Builds the Windows installer and the macOS DMGs.
# - Push a tag `v*` to publish a GitHub Release with all three files.
# - Run manually (workflow_dispatch) to get them as workflow artifacts only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: cargo run -p xtask -- dist-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*-setup.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            triple: aarch64-apple-darwin
          - runner: macos-14
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}
      - name: Build DMG
        run: cargo run -p xtask -- dist-macos ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.triple }}
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
